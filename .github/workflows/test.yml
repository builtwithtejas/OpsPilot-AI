name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          API_KEY: test-key
          GEMINI_API_KEY: test
          GITLAB_TOKEN: test
          DATABASE_URL: sqlite:///./test.db
        run: pytest tests/ -v